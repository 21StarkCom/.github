# Reusable gitleaks secret scan for 21StarkCom repositories.
#
# This is the CI half of the replacement for GitHub Secret Protection, which is
# disabled org-wide on purpose. Callers are thin: they pin this workflow by
# commit SHA and pass nothing unless they differ from the defaults.
#
# ---------------------------------------------------------------------------
# THE JOB NAME IS A PUBLIC CONTRACT — BOTH HALVES OF IT.
#
# A check run produced by a reusable workflow is named
#     <caller job name> / <called job name>
# so the status-check context a branch ruleset must require is NOT simply
# `secret-scan`. A ruleset names ONE literal context for the whole fleet, so
# every caller must produce the SAME string. That fixes the caller's side too:
#
#     jobs:
#       secret-scan:              # <- this id/name is part of the contract
#         uses: 21StarkCom/.github/.github/workflows/secret-scan.yml@<sha>
#
# Name the calling job `secret-scan` and leave it unnamed otherwise, so the
# context is exactly `secret-scan / secret-scan`. Renaming either half silently
# breaks every ruleset naming it, and a ruleset requiring a context that never
# reports blocks EVERY merge on that repo ("Expected — waiting for status").
# ---------------------------------------------------------------------------
#
# CALLERS OWN CONCURRENCY. This workflow deliberately declares no `concurrency`
# group: a group declared in a called workflow applies to every caller at once
# and can wedge the calling job. Set it on the CALLING workflow, and cancel PR
# runs only:
#
#     concurrency:
#       group: secret-scan-${{ github.event.pull_request.number || github.ref }}
#       cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#
# Never cancel a push run: each push scans its own commit range, so a cancelled
# one leaves those commits permanently unscanned.
#
# Scope is the INCOMING COMMITS (the PR diff range, or the pushed range on the
# default branch), not full history. That is deliberate: a diff-scoped scan lets
# a false positive be handled with an inline `gitleaks:allow` or a fingerprint
# instead of a permanent history-scoped `paths` entry that can never age out.
# The flip side, stated plainly: this cannot see a secret committed before it
# landed, and a secret that merges is already burned and must be rotated. A
# green check means "these commits added none", not "this repo has none".
#
# We install a pinned gitleaks release by curl rather than using
# gitleaks/gitleaks-action, which requires a paid licence for organization repos.

name: secret-scan (reusable)

on:
  workflow_call:
    inputs:
      config_path:
        description: >-
          Path to the caller's gitleaks config. The scan REFUSES to run if this
          file is missing rather than silently falling back to the stock
          ruleset, which would go green while scanning with the wrong rules.
        type: string
        required: false
        default: .gitleaks.toml
      runs_on:
        description: >-
          Runner label. MUST resolve to a Linux x86_64 runner: this job
          installs the `linux_x64` gitleaks build and verifies it with
          `sha256sum`, neither of which exists on a macOS or arm64 runner. The
          job is checked at startup and fails fast if the runner is neither.
          It runs no caller code — a curl of a static Linux binary plus a git
          walk — so the default is correct even for macOS-only projects, and
          materially cheaper than a macOS runner.
        type: string
        required: false
        default: ubuntu-latest
      gitleaks_version:
        description: Pinned gitleaks release. Bump together with gitleaks_sha256.
        type: string
        required: false
        default: "8.30.1"
      gitleaks_sha256:
        description: >-
          sha256 of gitleaks_<version>_linux_x64.tar.gz, taken from the
          release's published checksums file. Bump together with the version.
        type: string
        required: false
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      selftest_rule_id:
        description: >-
          Rule id the self-test asserts fires, proving the caller's custom rules
          are loaded and not just the stock ruleset. Set to an empty string to
          assert only the stock rules. Changing it REQUIRES changing
          selftest_probe_prefix/selftest_probe_hex_bytes to a token that rule
          matches — the three are one unit.
        type: string
        required: false
        default: google-oauth-client-secret
      selftest_probe_prefix:
        description: >-
          Literal prefix of the token the custom-rule self-test feeds to the
          scanner, followed at runtime by 2*selftest_probe_hex_bytes random hex
          characters. The assembled token must be one selftest_rule_id matches.
          The default is safe to write down: `GOCSPX-` on its own matches no
          rule, since the rule requires 28 trailing characters.
        type: string
        required: false
        default: "GOCSPX-"
      selftest_probe_hex_bytes:
        description: >-
          Random bytes appended to selftest_probe_prefix; the probe gains twice
          this many hex characters. 14 gives the 28 the default
          google-oauth-client-secret rule requires.
        type: number
        required: false
        default: 14

permissions:
  contents: read

jobs:
  secret-scan:
    # See the contract note at the top of this file before renaming.
    name: secret-scan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      # Fail in seconds, with a readable message, rather than 3 minutes later
      # on `sha256sum: command not found` (macOS) or `Exec format error`
      # (arm64). `runs_on` is a label, not a platform: only Linux x86_64 works.
      - name: Check the runner platform
        run: |
          set -euo pipefail
          os="$(uname -s)"
          arch="$(uname -m)"
          if [ "$os" != "Linux" ] || [ "$arch" != "x86_64" ]; then
            echo "::error::this workflow installs the linux_x64 gitleaks build; runs_on must name a Linux x86_64 runner (got ${os}/${arch})."
            exit 1
          fi

      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # This job downloads a third-party binary, installs it as root and
          # runs it over the working tree. It never pushes, so do not leave a
          # repo-scoped GITHUB_TOKEN in .git/config for that binary to find.
          # `fetch-depth: 0` fetches `+refs/heads/*:refs/remotes/origin/*`, so
          # every base branch is already local and no later step needs to
          # fetch — and therefore none needs credentials.
          persist-credentials: false

      # Cache the TARBALL, not the unpacked binary, so the checksum below can
      # be re-verified on every run. The key names the expected digest, but the
      # cache service does not enforce it: any run that can write this repo's
      # cache can store different bytes under the same key.
      - name: Restore the cached gitleaks download
        id: gitleaks-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/gitleaks-dl
          key: gitleaks-linux-x64-${{ inputs.gitleaks_version }}-${{ inputs.gitleaks_sha256 }}

      - name: Download pinned gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p /tmp/gitleaks-dl
          # This workflow is meant to BE a required check. A single unretried
          # curl means one transient 5xx or DNS blip blocks merges fleet-wide.
          # Worst case is 5*60s of transfer plus 2+4+8+16s of backoff = 5m30s,
          # which must stay comfortably inside the job's timeout-minutes so the
          # loop reports its own error instead of being killed mid-retry.
          ok=""
          delay=2
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 10 --max-time 60 "$url" -o /tmp/gitleaks-dl/gitleaks.tar.gz; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::gitleaks download attempt ${attempt}/5 failed; retrying in ${delay}s"
              sleep "$delay"
              delay=$(( delay * 2 ))
            fi
          done
          if [ -z "$ok" ]; then
            echo "::error::could not download gitleaks ${GITLEAKS_VERSION} after 5 attempts."
            exit 1
          fi

      - name: Verify and install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks_sha256 }}
        run: |
          set -euo pipefail
          # Verify on EVERY run, cache hit included. Skipping the checksum for
          # restored bytes would mean the one binary standing between the fleet
          # and a leaked credential gets installed as root unverified whenever
          # the cache happens to hit. Compare against the digest published in
          # the release checksums file, pinned as a literal input: a checksum
          # fetched over the same channel as the artifact proves nothing. A
          # mismatch is a hard stop — never execute an unverified binary.
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks-dl/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks-dl/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          got="$(gitleaks version)"
          echo "gitleaks version: $got"
          # Fail loudly rather than scan with an unexpected ruleset.
          test "${got#v}" = "$GITLEAKS_VERSION"

      - name: Self-test the scanner and the caller's config
        # A clean repo means this gate ships green and stays green, so a silent
        # breakage (missing binary, wrong config path, empty ruleset) would look
        # exactly like success. Prove the scanner fires before trusting a pass.
        # Test tokens are assembled at runtime so this file never contains a
        # literal any rule would match.
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          SELFTEST_RULE_ID: ${{ inputs.selftest_rule_id }}
          SELFTEST_PROBE_PREFIX: ${{ inputs.selftest_probe_prefix }}
          SELFTEST_PROBE_HEX_BYTES: ${{ inputs.selftest_probe_hex_bytes }}
        run: |
          set -euo pipefail
          test -f "$CONFIG_PATH" || {
            echo "::error::${CONFIG_PATH} is missing — refusing to scan with the stock ruleset."
            exit 1
          }

          # Assert on the REPORT, never on the exit code. gitleaks exits 1 both
          # when it finds a leak and when it cannot load the config at all, so
          # "non-zero means it fired" passes just as happily on a broken .toml.
          # `--exit-code 0` makes a detection exit 0, which leaves a non-zero
          # exit meaning one thing only: the scanner could not run.
          run_probe() {
            rm -f /tmp/selftest.json
            if ! gitleaks stdin -c "$CONFIG_PATH" --redact --no-banner --exit-code 0 \
                   --report-format json --report-path /tmp/selftest.json < "$1"; then
              echo "::error::gitleaks could not run against ${CONFIG_PATH} — the binary or the config is broken."
              exit 1
            fi
          }

          prefix="$(printf 'gh%s_' p)"
          hex="$(openssl rand -hex 18)"
          printf 'test_pat = "%s%s"\n' "$prefix" "$hex" > /tmp/selftest-pat.txt
          run_probe /tmp/selftest-pat.txt
          if ! grep -q '"RuleID"' /tmp/selftest.json; then
            echo "::error::gitleaks did not flag a synthetic GitHub PAT — the scanner or config is broken."
            cat /tmp/selftest.json || true
            exit 1
          fi

          if [ -n "$SELFTEST_RULE_ID" ]; then
            # Prove the caller's CUSTOM rules loaded, not just the stock set.
            # Use a BARE token with no `key =` context: the stock
            # generic-api-key rule needs that context and so cannot be what
            # fires here. Assert on the rule id, not merely on a finding.
            test -n "$SELFTEST_PROBE_PREFIX" || {
              echo "::error::selftest_rule_id is set but selftest_probe_prefix is empty — there is no token to prove ${SELFTEST_RULE_ID} with."
              exit 1
            }
            hex="$(openssl rand -hex "$SELFTEST_PROBE_HEX_BYTES")"
            printf '%s%s\n' "$SELFTEST_PROBE_PREFIX" "$hex" > /tmp/selftest-rule.txt
            run_probe /tmp/selftest-rule.txt
            # -F: a rule id is a literal, not a regex, and `--` guards one that
            # starts with a dash.
            if ! grep -qF -- "$SELFTEST_RULE_ID" /tmp/selftest.json; then
              echo "::error::the ${SELFTEST_RULE_ID} rule did not fire on a bare token."
              cat /tmp/selftest.json || true
              exit 1
            fi
          fi
          echo "self-test OK: the scanner fires with the caller's config."

      - name: Scan the incoming commits
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          # Routed through env rather than interpolated into the script body:
          # a `${{ }}` expansion inside `run:` is pasted in as shell source
          # before the shell ever sees it. This workflow is a required check on
          # every repo in the fleet, so it does not get to be the exception.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          # Never let a git auth failure turn into a prompt that sits there
          # until timeout-minutes kills a required check.
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              # `fetch-depth: 0` already fetched +refs/heads/*, so the base
              # branch is normally right here: no network round trip and no
              # credentials needed. The fetch is a fallback for the day that
              # stops being true, not the happy path.
              base="$(git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" || true)"
              if [ -z "$base" ]; then
                git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
                base="$(git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" || true)"
              fi
              if [ -z "$base" ]; then
                echo "::error::origin/${BASE_REF} is not in the checkout; the scan range cannot be computed."
                exit 1
              fi
              base="$(git merge-base "$base" HEAD)"
              ;;
            merge_group)
              # The merge queue states the exact base it built the group on.
              base="$MERGE_GROUP_BASE"
              if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "::error::merge_group base_sha (${base:-empty}) is not in the checkout."
                exit 1
              fi
              ;;
            push)
              # github.event.before is all-zeros for a branch creation and can
              # point at a discarded commit after a force push; in either case
              # fall back to the head commit rather than silently scanning
              # nothing.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                  && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                base="$PUSH_BEFORE"
              else
                base="HEAD~1"
                git rev-parse --verify --quiet "${base}^{commit}" >/dev/null || base=""
              fi
              ;;
            *)
              # Every other event either has no incoming range at all
              # (workflow_dispatch, schedule) or checks out the wrong side of
              # the PR (pull_request_target checks out the base, so it can
              # never see the contributor's commits). Refuse rather than scan
              # one arbitrary commit and report a green that means nothing.
              echo "::error::unsupported event '${EVENT_NAME}'. Call this workflow from pull_request, merge_group or push only."
              exit 1
              ;;
          esac
          if [ -n "$base" ]; then
            range="${base}..HEAD"
          else
            # Root commit: no parent to diff against, so scan it alone.
            range="HEAD"
          fi
          echo "event=${EVENT_NAME} range=$range"
          count="$(git rev-list --count "$range")"
          echo "scanning $count commit(s) in $range"
          if [ "$count" -eq 0 ]; then
            echo "::error::empty scan range — refusing to report success without scanning anything."
            exit 1
          fi
          gitleaks git . \
            --log-opts="$range" \
            -c "$CONFIG_PATH" \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path /tmp/gitleaks-report.json
          test -f /tmp/gitleaks-report.json

      - name: Upload the gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: warn
