# HAND-MAINTAINED — the one caller in the fleet Terraform does not write.
#
# Every other 21StarkCom repo gets its caller rendered into
# .github/workflows/secret-scan.yml from 21StarkCom/21stark
# (repos/secret_scan.tf). In THIS repo that path already holds the REUSABLE
# workflow the whole fleet pins by SHA, and writing the caller there would
# replace it for everyone. So this repo sits in that tier's exclusion list and
# carries its caller under this name instead, by hand (STARK-7485). When the
# fleet template changes, mirror it here by eye — nothing enforces the match.
#
# WHY `./` AND NOT A SHA PIN
#
# Everywhere else the pin is a security control: a mutable ref inside a check
# that is REQUIRED is a fleet-wide remote-code-execution surface and an
# unauditable change channel. Here the workflow being called is this repo's
# own, in the very PR under review, so a pin isolates nothing — and it would
# cost something real: a PR that edits the reusable workflow would be scanned
# by the OLD pinned copy, leaving the one workflow the whole fleet depends on
# with no CI of its own. `./` runs the PR's version, so a change that breaks
# the scan fails here first, before any repo pins it.
#
# The residual risk, stated plainly: `./` checks a PR with the scanner that PR
# supplies, so an edit that quietly turns the scan into a no-op reports GREEN
# here instead of failing. A SHA pin would not catch that either — the old
# copy passes just as happily — so the control is human review of any PR that
# touches secret-scan.yml, the same review that decides what the fleet pins.
# On such a PR, read a green check as "the scanner you are proposing ran",
# never as "the scanner still works".
#
# DO NOT RENAME THE JOB BELOW — AND DO NOT GIVE IT A `name:`. A reusable
# workflow's check run is named "<caller job> / <called job>", and the left
# half is the calling job's `name:` when it has one and its job id otherwise,
# so adding a cosmetic `name:` renames the context just as surely as editing
# the id does. Leave it unnamed and called `secret-scan`, and the context
# stays the `secret-scan / secret-scan` the fleet's rulesets name. The full
# contract is at the top of .github/workflows/secret-scan.yml.
#
# THIS CHECK RUNS HERE, BUT NOTHING REQUIRES IT — YET. 21stark derives
# `local.secret_scan_enforced` from the repos whose caller Terraform writes,
# and this repo is excluded from that set, so no ruleset names the context on
# this repo and a red scan does not block a merge here. STARK-7635 is the
# enforcement path; until it lands, read a green check as advisory.

name: secret-scan

on:
  pull_request:
  # Scan the default branch on push too: a direct push bypasses a PR-only check
  # entirely, which is exactly the path someone takes in a hurry. This is
  # detection after the fact, not prevention — a secret pushed to the default
  # branch is already burned and must be rotated — but it gets NOTICED. It also
  # produces a check run ON the default branch, which is the precondition for
  # ever requiring this context in a ruleset.
  push:
    branches: [main]

permissions:
  contents: read

# Concurrency belongs to the caller, never to the reusable workflow; the
# reasoning, and why a push run must NEVER be cancelled, is in that file's
# header.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
